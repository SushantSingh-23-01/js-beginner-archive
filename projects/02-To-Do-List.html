<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>To-Do List</title>
	<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}
		body {
			font-family: system-ui, sans-serif;
			display: flex;
			flex-direction: column;
			justify-content: center;
			padding: 2rem;
		}
		h1 {
			margin: 1rem 0;
		}
		.input-container {
			display: flex;
			align-items: center;
			gap: 0.5rem;
			padding: 0.5rem;
		}
		.task-input {
			padding: 0.25rem;
			font-size: 1.25rem;
		}
		.add-btn {
			padding: 0.33rem;
			font-size: 1.25rem;
			cursor: pointer;
			background-color: #46B965;
			color: #FFF;
			border: none;
		}
		.add-btn:hover { background-color: #54AB6A; }
		.task-list {
			display: flex;
			flex-direction: column;
			list-style: none;
			margin: 1rem 0;
			width: 100%;
			max-width: 400px;
		}
		.task-list li {
			display: flex;
			justify-content: space-between;
			background-color: #e9ecef;
			margin: 0.5rem 0;
			padding: 0.5rem;
			font-size: 1.1rem;
		}
		.delete-btn {
			background-color: #CF3038;
			color: #fff;
			border: none;
			padding: 0.5rem;
			cursor: pointer;
		}
		.delete-btn:hover { background-color: #AF5058; }
	</style>
</head>
<body>
	<h1>TO-DO List</h1>
	<div class="input-container">
		<input id="taskInput" class="task-input" placeholder="New task">
		<button id="addBtn" class="add-btn">Add Task</button>	
	</div>
	<ul id="taskList" class="task-list"></ul>
	
	<script>
		const taskInput = document.getElementById('taskInput');
		const taskList = document.getElementById('taskList');
		
		const addBtn = document.getElementById('addBtn');
		
		function displayTask () {
			const newTask = taskInput.value.trim();
			
			if (newTask === '') return;
			
			const span = document.createElement('span');
			span.innerText = newTask;
			
			const deleteBtn = document.createElement('button');
			deleteBtn.classList.add('delete-btn');
			deleteBtn.innerText = 'Delete';
			
			const li = document.createElement('li');
			
			li.appendChild(span);
			li.appendChild(deleteBtn);
			
			taskList.appendChild(li);
			taskInput.value = '';
			
			deleteBtn.addEventListener('click', () => {
				taskList.removeChild(li);
			})
		}
		
		addBtn.addEventListener('click', displayTask);
		taskInput.addEventListener('keydown', (event) => {
			if (event.key === 'Enter') {
				displayTask();
			}
		});
	</script>
</body>	
</html>
