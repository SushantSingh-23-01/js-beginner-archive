<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Input Event Handling Demo</title>
	<style>
		body {
			font-family: system-ui, sans-serif;
			margin-bottom: 40px auto;
			padding: 20px;
			background-color: #f4f4f9;
		}
		.card {
			background: white;
			padding: 20px;
			border-radius: 8px;
		}
		label {
			display: block;
			margin-top: 15px;
			font-weight: 600;
		}
		input, select {
			width: 100%;
			padding: 10px;
			border: 1px solid #ccc;
			border-radius: 4px;
			box-sizing: border-box;
			margin-top: 10px;
		}
		.search-results {
			background: #e9ecef;
			padding: 10px;
			border-radius: 4px;
			min-height: 24px;
		}
	</style>
</head>
	<div class="card">
		<h2>Live Search</h2>
		<form id="search-form">
			<label for="primary-search">Primary Keyword:</label>
			<input type="text" id="primary-search" placeholder="Search title..." autocomplete="off">
			
			<label for="author-search">Author Keyword:</label>
			<input type="text" id="author-search" placeholder="Search author..." autocomplete="off">
			
			<label for="category-select">Category:</label>
			<select id="category-select" name="category">
				<option value="all">All Categories</option>
				<option value="tech">Tech</option>
				<option value="design">Design</option>
			</select>
		</form>
		
		<p>Live Typing Output:</p>
		<div id="live-output" class="search-results">Waiting for inputs...</div>
	</div>
	<script>
		const searchForm = document.getElementById('search-form');
		const liveOutput = document.getElementById('live-output');
		
		
		// 1. Single delegated event listener on the parent form
		searchForm.addEventListener('input', (event) => {
			// 2. Gather values using standard Form Data / Elements API
			const primary = searchForm.elements['primary-search'].value.trim();
			const author = searchForm.elements['author-search'].value.trim();
			const category = searchForm.elements['category-select'].value;

			// 3. Construct a unified output array for non-empty fieldset
			const activeFilters = [];
			
			if (primary) activeFilters.push(`Title: "${primary}"`);
			if (author) activeFilters.push(`Author: "${author}"`);
			if (category && category !== 'all') activeFilters.push(`Category: "${category}"`);
			
			
			// 4. Update UI dynamically based on active selections
			if (activeFilters.length > 0) {
				liveOutput.textContent = `Searching where ${activeFilters.join(' | ')}`;
			} else {
				liveOutput.textContent = 'Waiting for inputs...';
			}
		})
	</script>
</html>
