<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>preventDefault Demo</title>
	<style>
	body {padding: 20px;}
	#message {margin-top: 15px; color: green; font-weight: bold;}
	</style>
</head>
<body>
	<h2>preventDefault() Demo</h2>
	<p>Submitting this form won't refresh the page because we intercept the submit event.</p>
	
	<form id="myForm">
		<label for="username">Enter Name:</label>
		<input type="text" id="username" required>
		<button type="submit">Submit</button>
	</form>
	
	<div id="message"></div>
	<script>
		const form = document.getElementById('myForm');
		const messageDiv = document.getElementById('message');
		
		form.addEventListener('submit', function(event) {
			// Prevents the default form submission (stops page refresh)
			event.preventDefault();
			
			// Custom behavior instead
			const name = document.getElementById('username').value;
			messageDiv.textContent = `Form submitted successfully for "${name}" without refreshing!`;
		});
	</script>
</body>
</html>
